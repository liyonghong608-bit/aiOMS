<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>aiOMS · Buyer</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="colors_and_type.css" />
<link rel="stylesheet" href="aioms.css" />
<style>
.search-bar { display: flex; gap: var(--s-3); margin-bottom: var(--s-5); }
.search-bar input, .search-bar select { padding: 10px 14px; font-family: var(--font-body); font-size: var(--fs-14); color: var(--fg); background: var(--glass-bg-2); border: 1px solid var(--glass-border); border-radius: var(--r-sm); outline: none; }
.search-bar input { flex: 1; }
.search-bar input:focus, .search-bar select:focus { border-color: var(--plasma-500); box-shadow: 0 0 0 3px rgba(139,92,255,0.18); }
.search-bar select option { background: var(--void-800); }
.products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: var(--s-4); }
.prod-card { position: relative; overflow: hidden; background: var(--glass-bg-2); border: 1px solid var(--glass-border); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border-radius: var(--r-lg); padding: var(--s-5); box-shadow: var(--lift-1); transition: all var(--dur-base) var(--ease-orbit); }
.prod-card:hover { transform: translateY(-3px); border-color: var(--glass-border-strong); box-shadow: var(--lift-2); }
.prod-card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 60px; background: var(--grad-panel-sheen); opacity: 0.5; pointer-events: none; }
.prod-cat { position: relative; font-family: var(--font-mono); font-size: 10px; font-weight: 500; letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--plasma-300); margin-bottom: var(--s-2); }
.prod-name { font-family: var(--font-display); font-size: var(--fs-16); font-weight: 600; color: var(--fg); margin-bottom: 4px; line-height: 1.25; }
.prod-supplier { font-size: 11px; color: var(--fg-subtle); margin-bottom: var(--s-3); }
.prod-desc { font-size: var(--fs-12); color: var(--fg-faint); margin-bottom: var(--s-3); line-height: 1.5; min-height: 36px; }
.prod-price-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: var(--s-3); }
.prod-price { font-family: var(--font-display); font-size: var(--fs-24); font-weight: 600; color: var(--fg); letter-spacing: var(--tracking-tight); }
.prod-unit { font-size: 11px; color: var(--fg-subtle); }
.prod-stock { font-size: 11px; color: var(--fg-faint); }
.qty-row { display: flex; gap: var(--s-2); align-items: center; margin-bottom: var(--s-3); }
.qty-row input { width: 76px; padding: 8px 10px; font-family: var(--font-body); font-size: var(--fs-13); color: var(--fg); background: var(--glass-bg-1); border: 1px solid var(--glass-border); border-radius: var(--r-sm); text-align: center; outline: none; }
.qty-row input:focus { border-color: var(--plasma-500); }
.cart-empty { text-align: center; padding: var(--s-16) var(--s-5); color: var(--fg-faint); }
.cart-empty-ic { font-size: 52px; margin-bottom: var(--s-3); opacity: 0.5; }
.cart-item { display: flex; align-items: center; gap: var(--s-4); padding: var(--s-4) var(--s-5); border-bottom: 1px solid var(--divider-glass); }
.cart-item:last-child { border-bottom: none; }
.ci-info { flex: 1; }
.ci-name { font-size: var(--fs-14); font-weight: 600; color: var(--fg); }
.ci-sub { font-size: 11px; color: var(--fg-subtle); margin-top: 2px; }
.ci-qty { font-size: var(--fs-13); color: var(--fg-muted); min-width: 80px; text-align: center; }
.ci-price { font-family: var(--font-display); font-size: var(--fs-16); font-weight: 600; color: var(--fg); min-width: 90px; text-align: right; }
.ci-remove { color: var(--supernova-300); cursor: pointer; font-size: 18px; padding: 4px 8px; border-radius: var(--r-xs); }
.ci-remove:hover { background: rgba(255,79,107,0.14); }
.cart-summary { background: var(--glass-bg-2); border: 1px solid var(--glass-border); border-radius: var(--r-lg); padding: var(--s-5); }
.sum-row { display: flex; justify-content: space-between; font-size: var(--fs-13); padding: var(--s-1) 0; color: var(--fg-muted); }
.sum-row.total { font-family: var(--font-display); font-size: var(--fs-18); font-weight: 600; color: var(--fg); border-top: 1px solid var(--glass-border); margin-top: var(--s-2); padding-top: var(--s-3); }
.sum-note { font-size: 11px; color: var(--fg-faint); margin: var(--s-2) 0 var(--s-4); line-height: 1.5; }
</style>
</head>
<body>
<div class="cosmos-bg" aria-hidden="true"><div class="cosmos-bg__stars"></div><div class="cosmos-bg__glow"></div></div>
<div id="boot">Loading buyer portal…</div>

<div id="app" class="app" style="display:none">
  <aside class="sb">
    <div class="sb-brand"><div class="sb-logo"><div class="logo-orb">ai</div><div><div class="logo-text">aiOMS</div><div class="logo-sub">Buyer Portal</div></div></div></div>
    <div class="sb-user"><div class="user-avatar" id="uavatar">B</div><div class="user-meta"><div class="user-name" id="uname">—</div><div class="user-role buyer">Buyer</div></div></div>
    <nav class="sb-nav">
      <div class="nav-label">Menu</div>
      <div class="nav-item on" id="n-browse" onclick="nav('browse')"><span class="nav-ic">⊞</span> Browse</div>
      <div class="nav-item" id="n-cart" onclick="nav('cart')"><span class="nav-ic">▣</span> Cart <span class="nav-badge" id="cart-count" style="display:none"></span></div>
      <div class="nav-item" id="n-orders" onclick="nav('orders')"><span class="nav-ic">▤</span> My Orders</div>
    </nav>
    <div class="sb-foot"><div class="logout" onclick="doLogout()"><span class="nav-ic">⏻</span> Sign out</div></div>
  </aside>

  <div class="main">
    <div class="topbar"><h1 id="page-title">Browse Products</h1></div>
    <div class="content">
      <div class="page on" id="p-browse">
        <div class="press-banner"><img src="assets/press-machine.svg" alt="aiOMS 活字 press machine"></div>
        <div class="search-bar"><input id="search" placeholder="Search products…" oninput="filterProducts()"><select id="cat-filter" onchange="filterProducts()"><option value="">All Categories</option></select></div>
        <div class="products-grid" id="products-grid"><div class="loading"><div class="spin"></div></div></div>
      </div>
      <div class="page" id="p-cart"><div id="cart-view"></div></div>
      <div class="page" id="p-orders"><div id="orders-table"><div class="loading"><div class="spin"></div></div></div></div>
    </div>
  </div>
</div>

<div class="overlay" id="po-modal" onclick="if(event.target===this)closePOModal()">
  <div class="modal">
    <h2>Confirm Order</h2>
    <div class="modal-sub">Review before submitting. Prices include our service margin.</div>
    <div id="po-items"></div>
    <div class="modal-total"><span>Total</span><span id="po-total">$0.00</span></div>
    <div class="modal-foot"><button class="btn" onclick="closePOModal()">Cancel</button><button class="btn btn-success" id="submit-po-btn" onclick="submitPO()">✓ Submit Order</button></div>
  </div>
</div>

<div class="toast-wrap" id="toasts"></div>

<script src="shared.js"></script>
<script>
let USER=null,ALL_PRODS=[],CART={};
async function init(){
  const {data:{session}}=await db.auth.getSession();
  if(!session){location.href='index.html';return;}
  const {data:p}=await db.from('profiles').select('*').eq('id',session.user.id).single();
  if(!p||p.role!=='buyer'){location.href='index.html';return;}
  USER=p;
  document.getElementById('uname').textContent=p.full_name||p.email;
  document.getElementById('uavatar').textContent=initials(p.full_name||p.email);
  document.getElementById('boot').style.display='none';
  document.getElementById('app').style.display='flex';
  await loadCats(); await loadProducts();
}
async function loadCats(){ const {data}=await db.from('categories').select('*').order('name'); document.getElementById('cat-filter').innerHTML='<option value="">All Categories</option>'+(data||[]).map(c=>`<option value="${c.id}">${c.name}</option>`).join(''); }
async function loadProducts(){ const {data}=await db.from('products').select('*,profiles!supplier_id(company_name,full_name),categories(name)').eq('is_active',true).order('name'); ALL_PRODS=data||[]; renderProducts(ALL_PRODS); }
function filterProducts(){
  const q=document.getElementById('search').value.toLowerCase(), cat=document.getElementById('cat-filter').value;
  renderProducts(ALL_PRODS.filter(p=>(!q||p.name.toLowerCase().includes(q)||(p.description||'').toLowerCase().includes(q))&&(!cat||p.category_id===cat)));
}
function renderProducts(prods){
  const el=document.getElementById('products-grid');
  if(!prods.length){el.innerHTML='<div class="empty" style="grid-column:1/-1"><div class="empty-ic">⊘</div><p>No products found</p></div>';return;}
  el.innerHTML=prods.map(p=>{const inCart=CART[p.id];return `<div class="prod-card" id="pc-${p.id}">
    <div class="prod-cat">${p.categories?.name||'General'}</div>
    <div class="prod-name">${p.name}</div>
    <div class="prod-supplier">by ${p.profiles?.company_name||p.profiles?.full_name||'Supplier'}</div>
    <div class="prod-desc">${p.description||'No description available.'}</div>
    <div class="prod-price-row"><div><div class="prod-price" id="price-${p.id}">···</div><div class="prod-unit">per ${p.unit||'unit'}</div></div><div class="prod-stock">Stock: ${p.stock_quantity||0}</div></div>
    <div class="qty-row"><input type="number" id="qty-${p.id}" value="${inCart?.qty||p.min_order_quantity||1}" min="${p.min_order_quantity||1}"><span style="font-size:11px;color:var(--fg-subtle)">Min: ${p.min_order_quantity||1}</span></div>
    <button class="btn btn-primary" style="width:100%" onclick="addToCart('${p.id}')">${inCart?'✓ Update Cart':'＋ Add to Cart'}</button></div>`;}).join('');
  prods.forEach(p=>fetchBuyerPrice(p.id));
}
async function fetchBuyerPrice(pid){ const {data,error}=await db.rpc('calculate_buyer_price',{p_product_id:pid,p_buyer_id:USER.id}); const el=document.getElementById('price-'+pid); if(el){el.textContent=error?'N/A':'$'+fmtNum(data); const prod=ALL_PRODS.find(p=>p.id===pid); if(prod)prod._bp=data;} }
function addToCart(pid){ const prod=ALL_PRODS.find(p=>p.id===pid); if(!prod)return; const qty=parseFloat(document.getElementById('qty-'+pid).value)||1; if(qty<(prod.min_order_quantity||1)){toast(`Minimum order: ${prod.min_order_quantity||1}`,'e');return;} CART[pid]={prod,qty,bp:prod._bp||0}; updateBadge(); toast(`${prod.name} added`,'s'); const b=document.querySelector(`#pc-${pid} .btn-primary`); if(b)b.textContent='✓ Update Cart'; }
function removeFromCart(pid){ delete CART[pid]; updateBadge(); renderCart(); }
function updateBadge(){ const c=Object.keys(CART).length, b=document.getElementById('cart-count'); b.textContent=c; b.style.display=c>0?'inline':'none'; }
function renderCart(){
  const el=document.getElementById('cart-view'), items=Object.entries(CART);
  if(!items.length){el.innerHTML='<div class="cart-empty"><div class="cart-empty-ic">▣</div><p style="font-size:16px;font-weight:600;color:var(--fg-muted)">Your cart is empty</p><p style="margin-top:8px;font-size:13px">Browse products to get started.</p></div>';return;}
  let total=0; const rows=items.map(([id,{prod,qty,bp}])=>{const lt=bp*qty;total+=lt;return `<div class="cart-item"><div class="ci-info"><div class="ci-name">${prod.name}</div><div class="ci-sub">by ${prod.profiles?.company_name||'Supplier'} · $${fmtNum(bp)} per ${prod.unit||'unit'}</div></div><div class="ci-qty">${qty} ${prod.unit||'unit'}(s)</div><div class="ci-price">$${fmtNum(lt)}</div><div class="ci-remove" onclick="removeFromCart('${id}')">✕</div></div>`;}).join('');
  el.innerHTML=`<div class="panel" style="margin-bottom:var(--s-4)">${rows}</div><div class="cart-summary"><div class="sum-row"><span>${items.length} item(s)</span><span>$${fmtNum(total)}</span></div><div class="sum-row total"><span>Total</span><span>$${fmtNum(total)}</span></div><div class="sum-note">Prices include our service margin. Your order is automatically distributed across suppliers.</div><button class="btn btn-success" style="width:100%" onclick="openPOModal()">✓ Place Order — $${fmtNum(total)}</button></div>`;
}
function openPOModal(){ const items=Object.entries(CART); if(!items.length){toast('Cart is empty','e');return;} let total=0; document.getElementById('po-items').innerHTML=items.map(([id,{prod,qty,bp}])=>{const l=bp*qty;total+=l;return `<div class="mi-row"><span>${prod.name} × ${qty}</span><span>$${fmtNum(l)}</span></div>`;}).join(''); document.getElementById('po-total').textContent='$'+fmtNum(total); document.getElementById('po-modal').classList.add('show'); }
function closePOModal(){document.getElementById('po-modal').classList.remove('show');}
async function submitPO(){
  const btn=document.getElementById('submit-po-btn'); btn.disabled=true;btn.textContent='Submitting…';
  const items=Object.entries(CART); let tb=0,ts=0; items.forEach(([,{qty,bp,prod}])=>{tb+=bp*qty;ts+=prod.supplier_price*qty;});
  const {data:po,error:pe}=await db.from('purchase_orders').insert({buyer_id:USER.id,status:'submitted',total_buyer_price:tb,total_supplier_cost:ts}).select().single();
  if(pe){toast('Failed: '+pe.message,'e');btn.disabled=false;btn.textContent='✓ Submit Order';return;}
  const oi=items.map(([id,{prod,qty,bp}])=>({order_id:po.id,product_id:id,supplier_id:prod.supplier_id,quantity:qty,supplier_price:prod.supplier_price,buyer_price:bp,margin_percent:((bp-prod.supplier_price)/prod.supplier_price*100).toFixed(2),status:'pending'}));
  const {error:ie}=await db.from('order_items').insert(oi);
  if(ie){toast('Items failed: '+ie.message,'e');btn.disabled=false;btn.textContent='✓ Submit Order';return;}
  await db.rpc('split_order_to_suppliers',{p_order_id:po.id});
  CART={};updateBadge();closePOModal();btn.disabled=false;btn.textContent='✓ Submit Order';
  toast('Order placed successfully!','s'); nav('orders');
}
async function loadOrders(){
  const {data}=await db.from('purchase_orders').select('*,order_items(id,status,quantity,deadline_at,accepted_at,fulfilled_at,products(name,unit))').eq('buyer_id',USER.id).order('created_at',{ascending:false});
  const el=document.getElementById('orders-table');
  if(!data||!data.length){el.innerHTML='<div class="empty"><div class="empty-ic">▤</div><p>No orders yet. Place your first order!</p></div>';return;}
  el.innerHTML=data.map(o=>{
    const items=o.order_items||[];
    const rows=items.map(it=>`<tr><td style="padding-left:var(--s-6)"><span style="color:var(--fg-subtle)">↳</span> ${it.products?.name||'—'} <span style="color:var(--fg-faint)">×${it.quantity}</span></td><td>${statusBadge(it.status)}</td><td>${timerHtml(it)}</td></tr>`).join('');
    return `<div class="panel" style="margin-bottom:var(--s-3)">
      <div class="panel-head" style="cursor:pointer" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">
        <h3 style="font-size:var(--fs-14)"><code>${o.id.slice(0,8)}</code> · ${items.length} items · <strong>$${fmtNum(o.total_buyer_price)}</strong></h3>
        <div style="display:flex;align-items:center;gap:12px">${statusBadge(o.status)}<span style="color:var(--fg-faint);font-size:12px">${fmtDate(o.created_at)}</span></div>
      </div>
      <div style="display:none"><table><thead><tr><th>Item</th><th>Status</th><th>Delivery Countdown</th></tr></thead><tbody>${rows||'<tr><td colspan="3" style="color:var(--fg-faint)">No items</td></tr>'}</tbody></table></div>
    </div>`;
  }).join('');
  tickTimers();
}
function nav(page){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('on'));
  document.getElementById('p-'+page).classList.add('on'); document.getElementById('n-'+page).classList.add('on');
  document.getElementById('page-title').textContent={browse:'Browse Products',cart:'My Cart',orders:'My Orders'}[page];
  if(page==='cart')renderCart(); if(page==='orders')loadOrders();
}
init();
</script>
</body>
</html>
