<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>aiOMS · Sign in</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="colors_and_type.css" />
<link rel="stylesheet" href="aioms.css" />
<style>
.auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--s-5); }
.auth-card { width: 100%; max-width: 440px; }
.auth-brand { text-align: center; margin-bottom: var(--s-6); }
.auth-orb {
  width: 64px; height: 64px; border-radius: var(--r-lg); margin: 0 auto var(--s-4);
  background: var(--grad-event-horizon); display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 700; font-size: 24px; color: #fff;
  box-shadow: var(--glow-plasma); animation: float 6s ease-in-out infinite;
}
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.auth-brand h1 { font-family: var(--font-display); font-size: var(--fs-32); font-weight: 600; color: var(--fg); letter-spacing: var(--tracking-tighter); }
.auth-brand .eyebrow { margin-top: var(--s-2); }
.auth-panel { background: var(--glass-bg-3); border: 1px solid var(--glass-border-strong); backdrop-filter: var(--glass-blur-lg); -webkit-backdrop-filter: var(--glass-blur-lg); border-radius: var(--r-xl); padding: var(--s-8); box-shadow: var(--lift-2); }
.auth-panel h2 { font-family: var(--font-display); font-size: var(--fs-20); font-weight: 600; color: var(--fg); margin-bottom: var(--s-5); }
.roles { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); margin-top: 6px; }
.role { border: 1px solid var(--glass-border); border-radius: var(--r-md); padding: var(--s-4) var(--s-3); cursor: pointer; transition: all var(--dur-fast) var(--ease-orbit); text-align: center; user-select: none; background: var(--glass-bg-1); }
.role:hover { border-color: var(--plasma-500); background: var(--glass-bg-2); }
.role.on { border-color: var(--plasma-500); background: linear-gradient(135deg, rgba(139,92,255,0.2), rgba(255,61,154,0.1)); box-shadow: inset 0 1px 0 rgba(255,255,255,0.1); }
.role-ic { font-size: 24px; margin-bottom: var(--s-2); }
.role-name { font-size: var(--fs-13); font-weight: 700; color: var(--fg); }
.role-desc { font-size: 11px; color: var(--fg-subtle); margin-top: 2px; }
.btn-block { width: 100%; padding: 12px; margin-top: var(--s-2); }
.tog { text-align: center; margin-top: var(--s-5); font-size: var(--fs-13); color: var(--fg-subtle); }
.tog a { color: var(--plasma-300); text-decoration: none; font-weight: 700; cursor: pointer; }
.tog a:hover { color: var(--horizon-300); }
.alert { padding: 10px 14px; border-radius: var(--r-sm); font-size: var(--fs-13); margin-bottom: var(--s-4); display: none; }
.alert.show { display: block; }
.alert.err { background: rgba(255,79,107,0.14); color: var(--supernova-300); border: 1px solid rgba(255,79,107,0.3); }
.alert.ok { background: rgba(56,217,138,0.14); color: var(--quasar-300); border: 1px solid rgba(56,217,138,0.3); }
.spin-sm { display: inline-block; width: 13px; height: 13px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 7px; }
</style>
</head>
<body>
<div class="cosmos-bg" aria-hidden="true"><div class="cosmos-bg__stars"></div><div class="cosmos-bg__glow"></div></div>

<div id="boot">Initializing aiOMS…</div>

<div class="auth-wrap" id="ui" style="display:none">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-orb">ai</div>
      <h1>aiOMS</h1>
      <div class="eyebrow">Supply Intelligence · Builder OS</div>
    </div>
    <div class="auth-panel">
      <div class="alert err" id="err"></div>
      <div class="alert ok" id="ok"></div>

      <div id="vlogin">
        <h2>Welcome back</h2>
        <div class="fg"><label>Email</label><input type="email" id="lemail" placeholder="you@company.com"></div>
        <div class="fg"><label>Password</label><input type="password" id="lpass" placeholder="••••••••"></div>
        <button class="btn btn-primary btn-block" id="lbtn" onclick="doLogin()">Sign in</button>
      </div>

      <div id="vsign" style="display:none">
        <h2>Create account</h2>
        <div class="fg"><label>Full name</label><input type="text" id="sname" placeholder="John Smith"></div>
        <div class="fg"><label>Company</label><input type="text" id="sco" placeholder="Acme Corp"></div>
        <div class="fg"><label>Email</label><input type="email" id="semail" placeholder="you@company.com"></div>
        <div class="fg"><label>Password</label><input type="password" id="spass" placeholder="Min. 8 characters"></div>
        <div class="fg">
          <label>Account type</label>
          <div class="roles">
            <div class="role on" id="rb" onclick="setRole('buyer')"><div class="role-ic">🛒</div><div class="role-name">Buyer</div><div class="role-desc">Source & purchase</div></div>
            <div class="role" id="rs" onclick="setRole('supplier')"><div class="role-ic">📦</div><div class="role-name">Supplier</div><div class="role-desc">List & sell</div></div>
          </div>
        </div>
        <button class="btn btn-primary btn-block" id="sbtn" onclick="doSignup()">Create account</button>
      </div>

      <div class="tog" id="tl">New to aiOMS? <a onclick="sw('sign')">Create an account</a></div>
      <div class="tog" id="ts" style="display:none">Already registered? <a onclick="sw('login')">Sign in</a></div>
    </div>
  </div>
</div>

<script>
const SU='https://mqzrbekmtguhigtvqzay.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xenJiZWttdGd1aGlndHZxemF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNjY4NTIsImV4cCI6MjA5NDc0Mjg1Mn0.jDnU5ntMvx6fufcfpDW-IpcFJnQqN6LTqvMQcrHfz7o';
const db=supabase.createClient(SU,SK);
let role='buyer';

async function init(){
  const {data:{session}}=await db.auth.getSession();
  if(session){await go(session.user.id);return;}
  document.getElementById('boot').style.display='none';
  document.getElementById('ui').style.display='flex';
}
async function go(uid){
  const {data:p}=await db.from('profiles').select('role').eq('id',uid).single();
  if(!p){document.getElementById('boot').style.display='none';document.getElementById('ui').style.display='flex';return;}
  const map={supplier:'supplier.html',buyer:'buyer.html',admin:'admin.html'};
  location.href=map[p.role]||'buyer.html';
}
function setRole(r){ role=r; document.getElementById('rb').classList.toggle('on',r==='buyer'); document.getElementById('rs').classList.toggle('on',r==='supplier'); }
function sw(v){
  document.getElementById('vlogin').style.display=v==='login'?'block':'none';
  document.getElementById('vsign').style.display=v==='sign'?'block':'none';
  document.getElementById('tl').style.display=v==='login'?'block':'none';
  document.getElementById('ts').style.display=v==='sign'?'block':'none';
  clr();
}
function msg(txt,type='err'){ const el=document.getElementById(type==='err'?'err':'ok'); el.textContent=txt; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),5000); }
function clr(){['err','ok'].forEach(id=>document.getElementById(id).classList.remove('show'));}
function ld(btn,on){ btn.disabled=on; btn.innerHTML=on?'<span class="spin-sm"></span>Please wait…':btn.dataset.l; }

async function doLogin(){
  const btn=document.getElementById('lbtn'); btn.dataset.l='Sign in'; ld(btn,true); clr();
  const {data,error}=await db.auth.signInWithPassword({ email:document.getElementById('lemail').value.trim(), password:document.getElementById('lpass').value });
  if(error){msg(error.message);ld(btn,false);return;}
  await go(data.user.id);
}
async function doSignup(){
  const btn=document.getElementById('sbtn'); btn.dataset.l='Create account'; ld(btn,true); clr();
  const name=document.getElementById('sname').value.trim(), co=document.getElementById('sco').value.trim();
  const email=document.getElementById('semail').value.trim(), pass=document.getElementById('spass').value;
  if(!name||!email||!pass){msg('Please fill all fields.');ld(btn,false);return;}
  if(pass.length<8){msg('Password must be at least 8 characters.');ld(btn,false);return;}
  const {data,error}=await db.auth.signUp({ email,password:pass, options:{data:{full_name:name,company_name:co,role}} });
  if(error){msg(error.message);ld(btn,false);return;}
  msg('Account created! Redirecting…','ok');
  setTimeout(()=>go(data.user.id),1200);
}
document.addEventListener('keydown',e=>{ if(e.key!=='Enter')return; const lv=document.getElementById('vlogin').style.display!=='none'; lv?doLogin():doSignup(); });
init();
</script>
</body>
</html>
